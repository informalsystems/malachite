[package]
name = "informalsystems-malachitebft-signing-remote"
description = "HTTP remote signing provider for the Malachite BFT consensus engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
malachitebft-core-types = { workspace = true }
malachitebft-signing = { workspace = true }
malachitebft-signing-ecdsa = { workspace = true, features = ["k256", "serde"] }

async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
